name: Docker & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "codex/ki-integration" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision the native ChatGPT runtime
        run: sudo env "PATH=$PATH" bash scripts/install-ai-runtime.sh

      - name: Verify the real native sandbox and app-server
        run: npm run check:ai-runtime

      - name: Lint
        run: npm run lint

      - name: Test with isolated runtime data
        run: |
          test_data_dir="$(mktemp -d)"
          trap 'rm -rf "$test_data_dir"' EXIT
          DATA_DIR="$test_data_dir" npm test

      - name: Build
        run: npm run build

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  build-docker:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Build Docker image for runtime verification
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: iptv-manager:runtime-check
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify a standalone Portainer-style Compose stack
        shell: bash
        run: |
          directory="$(mktemp -d)"
          cp docker-compose.yml "$directory/compose.yml"
          # No repository profiles, bind mounts or published ports in this check.
          printf '%s\n' '{"services":{"iptv-manager":{"image":"iptv-manager:runtime-check","volumes":[{"type":"tmpfs","target":"/data"}]}}}' > "$directory/verify.json"
          docker compose -p iptv-default-profile-check -f "$directory/compose.yml" -f "$directory/verify.json" \
            run --rm --no-deps iptv-manager node -e \
            'const assert = require("node:assert/strict"); assert.notEqual(process.getuid(), 0); assert.equal(process.env.AI_CODEX_ENABLED, "false"); console.log("Standalone Compose startup passed with Docker defaults.");'

      - name: Verify the real container sandbox and app-server
        shell: bash
        run: |
          security=(--security-opt seccomp=./docker/ai-seccomp.json)
          if docker info --format '{{json .SecurityOptions}}' | grep -q apparmor; then
            sudo apparmor_parser -r -W docker/ai-apparmor
            security+=(--security-opt apparmor=iptv-manager-ai)
          fi
          docker run --name iptv-ai-runtime-check "${security[@]}" \
            iptv-manager:runtime-check npm run check:ai-runtime

      - name: Push verified Docker image
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' iptv-manager:runtime-check)"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$image_id" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

  release-package:
    needs:
      - validate
      - build-docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Create Zip Archive
        run: |
          zip -r iptv-manager.zip . -x "node_modules/*" ".git/*" ".github/*" "docker_data/*" "data/*" "temp_check_data/*"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: iptv-manager.zip
          generate_release_notes: true
