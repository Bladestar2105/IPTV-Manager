name: Container release retention

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry-run first; apply requires the reviewed plan hash
        type: choice
        options: [dry-run, apply]
        default: dry-run
        required: true
      plan_sha256:
        description: SHA256 from the reviewed dry-run artifact (apply only)
        type: string
        default: ''
      missing_release_tags:
        description: JSON array of explicitly acknowledged historical releases with no image (same value for dry-run/apply)
        type: string
        default: '[]'

concurrency:
  group: ghcr-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate planner
        run: |
          npm ci
          npm exec vitest run tests/container_release_retention.test.js
      - name: Plan or apply reviewed retention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETENTION_MODE: ${{ inputs.mode }}
          RETENTION_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          RETENTION_MISSING_RELEASE_TAGS: ${{ inputs.missing_release_tags }}
        run: node scripts/container-release-retention.mjs
      - name: Preserve reviewable inventory and plan
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: container-retention-plan
          path: |
            container-retention-inventory.json
            container-retention-plan.json
            container-retention-plan.sha256
          if-no-files-found: warn
          retention-days: 30
