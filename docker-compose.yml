services:
  iptv-manager:
    image: ghcr.io/bladestar2105/iptv-manager:latest
    container_name: iptv-manager
    restart: unless-stopped
    # The primary runs a synchronous WAL checkpoint, and the first one after an
    # upgrade can have a multi-gigabyte log to drain. Docker's default 10s would
    # SIGKILL the container in the middle of it, which is exactly the abandoned
    # state the startup sweeps then have to clean up.
    stop_grace_period: 90s
    # Self-contained for Portainer Web Editor; Docker's default security applies.
    # Personal ChatGPT accounts: add docker-compose.chatgpt.yml after host setup.
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - ./data:/data
    # Without a limit the JSON log file grows without bound and older output is
    # never rotated away, so a past incident cannot be reconstructed.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      - DATA_DIR=/data
      - NODE_ENV=production
      - AI_CODEX_ENABLED=false
      # - TRUST_PROXY=true # Set to true if running behind a reverse proxy (e.g. Traefik, Nginx)
      # - INITIAL_ADMIN_PASSWORD=change_me_on_first_login

      # Security thresholds and durations are configurable via the Web UI (Security Tab).
      # Defaults are:
      # - Admin Block Threshold: 5 attempts
      # - IPTV Block Threshold: 10 attempts
      # - Admin Block Duration: 3600 seconds (1 hour)
      # - IPTV Block Duration: 3600 seconds (1 hour)
